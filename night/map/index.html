<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KYPSN 10년 뒤 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --gold:#E2B857; --ink:#F3EEDF; --navy:#0E1630; --mute:#8E9AC4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070F; color: var(--ink); font-family: "Noto Sans KR", system-ui, sans-serif; overflow: hidden; }
  .px { font-family: "Press Start 2P", monospace; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .world { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden;
    background: radial-gradient(ellipse at 50% 54%, #18224A 0, #0E1630 45%, #070B1C 100%); cursor: pointer; }
  .world svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .stars i { position: absolute; width: .14cqw; height: .14cqw; background: #44508A; }

  /* 머리말 */
  .head { position: absolute; left: 3cqw; top: 2.4cqw; }
  .head .px { font-size: .7cqw; color: var(--gold); letter-spacing: .05em; }
  .head h1 { margin: .6cqw 0 0; font-size: 2.5cqw; font-weight: 900; letter-spacing: -.02em; }
  .head p { margin: .35cqw 0 0; font-size: 1cqw; color: var(--mute); }
  .badge { position: absolute; right: 3cqw; top: 2.6cqw; font-size: .7cqw; color: #9AA6CC; border: .12cqw solid #2C3866; border-radius: 2cqw; padding: .45cqw .8cqw; }
  .badge b { color: var(--gold); }
  .dots { position: absolute; right: 3cqw; top: 5.2cqw; display: flex; gap: .4cqw; }
  .dots i { width: .55cqw; height: .55cqw; border-radius: 50%; background: #2C3866; }
  .dots i.on { background: var(--gold); }

  /* 사람 */
  .ag { position: absolute; width: 2.6cqw; transform: translate(-50%, -50%); transition: left .9s cubic-bezier(.4,.1,.2,1), top .9s cubic-bezier(.4,.1,.2,1), opacity .4s, filter .4s; z-index: 5; }
  .ag .bd { animation: bob 1.6s ease-in-out infinite alternate; }
  .ag canvas { width: 100%; display: block; image-rendering: pixelated; }
  .ag .nm { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: .1cqw; white-space: nowrap; font-size: .6cqw; font-weight: 700; color: #DDE3F6; background: rgba(8,12,28,.7); padding: 0 .22cqw; border-radius: .2cqw; }
  .ag.pop .bd { animation: pop .7s cubic-bezier(.3,1.8,.5,1), bob 1.6s .7s ease-in-out infinite alternate; }
  .ag.hide { opacity: 0; }
  .ag.dim { opacity: .22; filter: grayscale(.8); }
  .ag.hi { z-index: 8; filter: drop-shadow(0 0 .5cqw rgba(226,184,87,.95)); }
  .ag.hi .nm { background: var(--gold); color: #1A1406; }
  .ag.hi .bd { animation: hop .5s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-6%); } }
  @keyframes hop { from { transform: translateY(0) scale(1.15); } to { transform: translateY(-22%) scale(1.15); } }
  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.4); } 100% { transform: scale(1); } }

  .ag .rl { display: none; }
  .ag.big { width: 3.6cqw; }
  .ag.big .nm { font-size: .95cqw; padding: .05cqw .4cqw; }
  .ag.big .rl { display: block; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 1.75cqw; white-space: nowrap; font-size: .7cqw; color: #AEB8DA; }
  .ag.chosen .nm { background: var(--gold); color: #1A1406; }
  .ag.unchosen { opacity: .4; }
  .ag.chosen, .ag.unchosen { cursor: pointer; }
  .pick { position: absolute; right: 3cqw; top: 7cqw; width: 22cqw; background: rgba(8,12,28,.94); border: .14cqw solid var(--gold); border-radius: .8cqw; padding: 1cqw 1.1cqw; z-index: 30; cursor: default; }
  .pick.hidden { display: none; }
  .pick b { font-size: 1cqw; color: var(--gold); }
  .pick p { font-size: .72cqw; color: #B7C0E0; line-height: 1.5; margin: .4cqw 0 .6cqw; }
  .pick textarea { width: 100%; height: 6cqw; font: inherit; font-size: .8cqw; background: #0E1533; color: var(--ink); border: .1cqw solid #2C3866; border-radius: .4cqw; padding: .4cqw; resize: none; }
  .pick .row { display: flex; flex-wrap: wrap; gap: .35cqw; margin-top: .5cqw; }
  .pick button { font: inherit; font-size: .75cqw; font-weight: 700; color: var(--ink); background: #1C2550; border: 0; border-radius: 1cqw; padding: .3cqw .7cqw; cursor: pointer; }
  .pick button[data-p=apply] { background: var(--gold); color: #1A1406; }
  .pick .st { font-size: .72cqw; color: var(--gold); margin-top: .5cqw; line-height: 1.5; }

  /* 선과 목적지 */
  .ln { fill: none; stroke-width: 2.2; stroke-linecap: round; opacity: .75; transition: opacity .5s; }
  .ln.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .lines.faint .ln { opacity: .12; }
  .lines.off { opacity: 0; }
  .node { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: .55cqw; padding: .45cqw .9cqw .45cqw .5cqw; border-radius: 3cqw;
    background: rgba(8,12,28,.9); border: .16cqw solid var(--c); white-space: nowrap; transition: opacity .5s, transform .5s, left .9s, top .9s; z-index: 6; }
  .node .ct { min-width: 2.2cqw; height: 2.2cqw; border-radius: 50%; background: var(--c); color: #0B0F22; display: flex; align-items: center; justify-content: center; font-family: "Press Start 2P", monospace; font-size: .8cqw; }
  .node .lb { font-size: 1.05cqw; font-weight: 900; }
  .node .lb small { display: block; font-size: .62cqw; font-weight: 700; color: var(--mute); }
  .node.off { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
  .node.faint { opacity: .25; }

  /* 가운데 */
  .center { position: absolute; left: 50%; top: 53.9%; transform: translate(-50%, -50%); width: 31cqw; text-align: center; z-index: 4; }
  .center img.em { width: 9cqw; opacity: .95; filter: drop-shadow(0 0 1.2cqw rgba(226,184,87,.25)); transition: width .6s; }
  .center .big { font-size: 2cqw; font-weight: 900; margin-top: .8cqw; letter-spacing: -.02em; }
  .center .big b { color: var(--gold); }
  .center .sub { font-size: 1cqw; color: var(--mute); margin-top: .45cqw; line-height: 1.5; }
  .center .kick { font-size: .85cqw; font-weight: 700; color: var(--gold); letter-spacing: .04em; margin-top: .4cqw; }
  .center .fact .em { width: 3.4cqw; }
  .fact h2 { margin: .7cqw 0 0; font-size: 1.9cqw; font-weight: 900; line-height: 1.3; letter-spacing: -.02em; word-break: keep-all; }
  .fact h2 b { color: var(--gold); }
  .fact .sub { font-size: .95cqw; }
  .bars { margin: 1cqw auto 0; width: 24cqw; display: grid; gap: .45cqw; text-align: left; }
  .bars div { display: grid; grid-template-columns: 7.4cqw 1fr 1.8cqw; align-items: center; gap: .5cqw; font-size: .85cqw; font-weight: 700; }
  .bars .tr { height: .8cqw; background: #1C2550; border-radius: .4cqw; overflow: hidden; }
  .bars .tr i { display: block; height: 100%; width: 0; background: #5A6AA8; border-radius: .4cqw; transition: width .8s ease-out; }
  .bars .top .tr i { background: var(--gold); }
  .bars .top { color: var(--gold); }
  .bars span:last-child { text-align: right; font-family: "Press Start 2P", monospace; font-size: .62cqw; }
  .chips { margin: 1cqw auto 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .4cqw; width: 28cqw; }
  .chips span { font-size: .85cqw; font-weight: 700; padding: .2cqw .6cqw; border-radius: 2cqw; background: #1C2550; }
  .chips span.top { background: var(--gold); color: #1A1406; }
  .center .in { animation: fade .6s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(.6cqw); } to { opacity: 1; transform: none; } }

  /* 조작 막대 */
  .bar { position: absolute; left: 50%; bottom: 1.2cqw; transform: translateX(-50%); display: flex; gap: .4cqw; align-items: center; background: rgba(8,12,28,.9); border: .12cqw solid #2C3866; border-radius: 3cqw; padding: .4cqw .6cqw; z-index: 20; opacity: 0; transition: opacity .3s; }
  .bar.show, .bar:hover { opacity: 1; }
  .bar button { font: inherit; font-size: .85cqw; font-weight: 700; color: var(--ink); background: transparent; border: .12cqw solid transparent; border-radius: 2cqw; padding: .3cqw .8cqw; cursor: pointer; white-space: nowrap; }
  .bar button.on { border-color: var(--gold); color: var(--gold); }
  .bar .tag { font-size: .6cqw; color: var(--gold); padding: 0 .4cqw; }
</style>
</head>
<body>
<div class="wrap"><div class="world" id="world">
  <div class="stars" id="stars"></div>
  <svg viewBox="0 0 1600 900" preserveAspectRatio="none"><g class="lines off" id="lines"></g></svg>
  <div class="head">
    <div class="px">KYPSN NIGHT 2026 · MAP</div>
    <h1>KYPSN 10년 뒤 지도</h1>
    <p id="headSub">오늘 이 방에 모인 사람들이 가려는 길</p>
  </div>
  <div class="badge px" id="badge"></div>
  <div class="dots" id="dots"></div>
  <div class="center" id="center"></div>
</div></div>

<script src="../config.js?v=7"></script>
<script src="../night.js?v=7"></script>
<script src="../jazz.js?v=9"></script>
<script>
(function () {
  const K = window.KNight, CFG = K.CFG;
  const $ = id => document.getElementById(id);
  const world = $("world"), linesG = $("lines"), center = $("center");
  const params = new URLSearchParams(location.search);
  const DEMO = params.has("demo");
  const W = 1600, H = 900, CX = 800, CY = 485;

  // 10년 뒤 목적지 (체크인 카드의 "10년 뒤 나는?" 칸과 같은 순서)
  const FUT = [
    { k: "연구하는 임상의", en: "Clinician-Scientist", c: "#6F9BFF" },
    { k: "교수", en: "Professor", c: "#A98BFF" },
    { k: "창업가", en: "Founder", c: "#FF8A4C" },
    { k: "산업계 리더", en: "Industry", c: "#3FC6A8" },
    { k: "투자자", en: "Investor", c: "#E2B857" },
    { k: "아직 탐색 중", en: "Exploring", c: "#9AA3BF" }
  ];
  const futOf = p => FUT.find(f => f.k === p.future) || FUT[5];

  // 무대 화면에서 사회자가 숨긴 사람은 여기서도 숨긴다 (같은 브라우저)
  let hidden = {};
  function loadHidden() { try { hidden = (JSON.parse(localStorage.getItem("kypsn-night-stage")) || {}).hidden || {}; } catch (e) { hidden = {}; } }
  loadHidden();

  // 별
  (function () { const r = K.rng(7); const s = $("stars"); for (let i = 0; i < 70; i++) { const d = document.createElement("i"); d.style.left = (r() * 100) + "%"; d.style.top = (r() * 100) + "%"; d.style.opacity = .3 + r() * .6; s.appendChild(d); } })();

  function shortName(n) {
    n = String(n || "").trim(); const a = [...n]; let w = 0, out = "";
    const cw = ch => ch.charCodeAt(0) < 0x250 ? .6 : 1;
    if (a.reduce((s, ch) => s + cw(ch), 0) <= 4.5) return n;
    for (const ch of a) { if (w + cw(ch) > 4) break; w += cw(ch); out += ch; }
    return out + "…";
  }
  const pct = (x, y) => x / 1600 * 100 + "%";
  const pctY = y => y / 900 * 100 + "%";

  // ── 사람 ──
  const people = new Map();   // cid → {data, el}
  let order = [];             // 원 위 순서
  function upsert(e) {
    if (!e || e.kind !== "intro" || !e.cid || !String(e.name || "").trim()) return false;
    const p = people.get(e.cid);
    if (p) {
      if (e.ts && p.ts && String(e.ts) < String(p.ts)) return false;
      Object.assign(p, e); p.dirty = true; return true;
    }
    people.set(e.cid, Object.assign({ fresh: true }, e)); return true;
  }
  // ── 지도에 넣을 사람 고르기 ──
  // 명단은 이 PC 브라우저에만 저장한다(공개 코드·서버에 이름을 두지 않는다).
  // 이름 붙여넣기: 아직 체크인 안 한 사람도 체크인하는 순간 자동으로 들어온다. 캐릭터 클릭으로 넣고 빼기.
  const SK = DEMO ? "kypsn-night-map-demo" : "kypsn-night-map";
  let sel = (() => { try { return JSON.parse(localStorage.getItem(SK)) || {}; } catch (e) { return {}; } })();
  function selFix() { sel.names = sel.names || []; sel.add = sel.add || {}; sel.del = sel.del || {}; }
  selFix();
  const saveSel = () => { try { localStorage.setItem(SK, JSON.stringify(sel)); } catch (e) {} };
  const norm = s => String(s || "").replace(/\s+/g, "").toLowerCase();
  const byName = p => sel.names.some(n => norm(n) === norm(p.name));
  const chosen = p => !sel.del[p.cid] && (!!sel.add[p.cid] || byName(p));
  const selOn = () => sel.names.length > 0 || Object.keys(sel.add).length > 0;
  let picking = false;
  function toggle(p) {
    if (chosen(p)) { delete sel.add[p.cid]; if (byName(p)) sel.del[p.cid] = 1; }
    else { delete sel.del[p.cid]; if (!byName(p)) sel.add[p.cid] = 1; }
    saveSel(); render({ quiet: true });
  }
  function visible() {
    const all = [...people.values()].filter(p => !hidden[p.cid]);
    return picking || !selOn() ? all : all.filter(chosen);
  }

  function layout() {
    const list = visible();
    const gi = p => FUT.indexOf(futOf(p));
    list.sort((a, b) => gi(a) - gi(b) || String(a.ts || "").localeCompare(String(b.ts || "")) || a.cid.localeCompare(b.cid));
    order = list;
    const n = list.length, two = n > 22;
    const rx = n > 40 ? 440 : n > 22 ? 385 : n > 14 ? 330 : 365, ry = n > 40 ? 282 : n > 14 ? 268 : 232;
    list.forEach((p, i) => {
      const ang = -Math.PI / 2 + (i + .5) / Math.max(n, 1) * Math.PI * 2;
      const k = two ? (i % 2 ? 1.09 : .93) : 1;
      p.ang = ang; p.x = CX + Math.cos(ang) * rx * k; p.y = CY + Math.sin(ang) * ry * k;
    });
    // 목적지 위치: 그 길을 고른 사람들의 가운데 각도, 너무 붙으면 벌린다
    const nodes = [];
    FUT.forEach(f => {
      const m = list.filter(p => futOf(p) === f); if (!m.length) return;
      let sx = 0, sy = 0; m.forEach(p => { sx += Math.cos(p.ang); sy += Math.sin(p.ang); });
      nodes.push({ f, n: m.length, ang: Math.atan2(sy, sx) });
    });
    nodes.sort((a, b) => a.ang - b.ang);
    const MIN = .52;
    for (let it = 0; it < 40 && nodes.length > 1; it++) {
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i], b = nodes[(i + 1) % nodes.length];
        let gap = b.ang - a.ang; if (i === nodes.length - 1) gap += Math.PI * 2;
        if (gap < MIN) { const d = (MIN - gap) / 2; a.ang -= d; b.ang += d; }
      }
    }
    nodes.forEach(nd => { nd.x = CX + Math.cos(nd.ang) * 640; nd.y = CY + Math.sin(nd.ang) * (list.length <= 14 ? 368 : 352); });
    return nodes;
  }

  function paintAgent(p) {
    if (!p.el) {
      p.el = document.createElement("div"); p.el.className = "ag";
      p.el.innerHTML = '<div class="bd"><canvas></canvas></div><span class="nm"></span><span class="rl"></span>';
      p.el.querySelector(".bd").style.animationDelay = (-(K.hash(p.cid) % 1600) / 1000) + "s";
      p.el.addEventListener("click", ev => { if (!picking) return; ev.stopPropagation(); toggle(p); });
      world.appendChild(p.el);
    }
    K.draw(p.el.querySelector("canvas"), p.name + "|" + p.cid, 4, 0, K.look(p.pos, p.sex));
    p.el.querySelector(".nm").textContent = shortName(p.name);
    const role = String(p.role || "").trim();
    p.el.querySelector(".rl").textContent = [...role].length > 18 ? [...role].slice(0, 17).join("") + "…" : role;
    p.dirty = false;
  }

  let nodes = [], nodeEls = new Map();
  function render(opts) {
    opts = opts || {};
    loadHidden();
    nodes = layout();
    const inMap = new Set(order);
    people.forEach(p => { if (p.el && !inMap.has(p)) p.el.classList.add("hide"); });
    const big = order.length <= 14 && !picking;
    order.forEach((p, i) => {
      const isNew = !p.el; if (isNew || p.dirty) paintAgent(p);
      p.el.classList.remove("hide");
      p.el.classList.toggle("big", big);
      p.el.classList.toggle("chosen", picking && chosen(p));
      p.el.classList.toggle("unchosen", picking && !chosen(p));
      p.el.style.left = pct(p.x); p.el.style.top = pctY(p.y);
      if (isNew && !opts.quiet) { p.el.classList.add("pop"); setTimeout(() => p.el && p.el.classList.remove("pop"), 900); }
    });
    // 목적지
    const live = new Set(nodes.map(nd => nd.f.k));
    nodeEls.forEach((el, k) => { if (!live.has(k)) { el.remove(); nodeEls.delete(k); } });
    nodes.forEach(nd => {
      let el = nodeEls.get(nd.f.k);
      if (!el) { el = document.createElement("div"); el.className = "node off"; el.style.setProperty("--c", nd.f.c);
        el.innerHTML = '<span class="ct"></span><span class="lb"></span>'; world.appendChild(el); nodeEls.set(nd.f.k, el); }
      el.querySelector(".ct").textContent = nd.n;
      el.querySelector(".lb").innerHTML = ""; el.querySelector(".lb").append(nd.f.k); const sm = document.createElement("small"); sm.textContent = nd.f.en; el.querySelector(".lb").appendChild(sm);
      el.style.left = pct(nd.x); el.style.top = pctY(nd.y);
    });
    drawLines(opts.animate);
    const allL = [...people.values()].filter(p => !hidden[p.cid]), allN = allL.length;
    const shownN = picking ? allL.filter(chosen).length : order.length;
    $("badge").innerHTML = (DEMO ? "DEMO" : K.LIVE ? "LIVE" : "LOCAL") + " · <b>" + shownN + "</b>명" + (selOn() || picking ? " / " + allN : "");
    if (picking) pickStat(allN);
    applyScene(false);
  }

  function drawLines(animate) {
    linesG.innerHTML = "";
    const byK = new Map(nodes.map(nd => [nd.f.k, nd]));
    order.forEach((p, i) => {
      const nd = byK.get(futOf(p).k); if (!nd) return;
      const c1x = CX + Math.cos(p.ang) * 470, c1y = CY + Math.sin(p.ang) * 380;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M${p.x.toFixed(1)} ${p.y.toFixed(1)} Q${c1x.toFixed(1)} ${c1y.toFixed(1)} ${nd.x.toFixed(1)} ${nd.y.toFixed(1)}`);
      path.setAttribute("pathLength", "1"); path.setAttribute("stroke", nd.f.c); path.setAttribute("class", "ln" + (animate ? " draw" : ""));
      if (animate) path.style.animationDelay = (i * 35) + "ms";
      linesG.appendChild(path);
    });
  }

  // ── 공통점 ──
  function count(list, get) { const m = new Map(); list.forEach(p => get(p).forEach(v => { if (v) m.set(v, (m.get(v) || 0) + 1); })); return [...m.entries()].sort((a, b) => b[1] - a[1]); }
  const split = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);
  function facts() {
    const L = order, N = L.length, out = [];
    const pos = count(L, p => [p.pos]);
    if (pos.length && pos[0][1] >= 2) out.push({ kick: "지금 나는", h: `가장 많은 자리는 <b>${esc(pos[0][0])}</b> · ${pos[0][1]}명`, sub: `${pos.length}가지 자리에서 왔습니다`, bars: pos.slice(0, 6), hi: p => p.pos === pos[0][0] });
    const it = count(L, p => split(p.interest));
    const itN = L.filter(p => split(p.interest).length).length;
    if (it.length && it[0][1] >= 2) out.push({ kick: "관심 분야", h: `<b>${it[0][1]}명</b>이 '${esc(it[0][0])}'에 관심`, sub: `관심 분야를 고른 ${itN}명 중 ${Math.round(it[0][1] / itN * 100)}%`, bars: it.slice(0, 6), hi: p => split(p.interest).includes(it[0][0]) });
    const poly = L.filter(p => split(p.interest).length >= 3);
    if (poly.length >= 2) out.push({ kick: "폴리매스형", h: `관심 분야를 3개 이상 고른 사람 <b>${poly.length}명</b>`, sub: "한 우물보다 여러 우물을 잇는 사람들<br>임상 · 연구 · 사업을 넘나듭니다", hi: p => split(p.interest).length >= 3 });
    const fu = count(L, p => [futOf(p).k]);
    const fuTop = fu.find(x => x[0] !== "아직 탐색 중") || fu[0];
    if (fuTop) out.push({ kick: "10년 뒤 나는", h: `가장 많이 고른 길은 <b>${esc(fuTop[0])}</b> · ${fuTop[1]}명`, sub: (fu.find(x => x[0] === "아직 탐색 중") ? `아직 탐색 중인 사람도 ${fu.find(x => x[0] === "아직 탐색 중")[1]}명. 오늘 여기서 찾으면 됩니다` : "모두 갈 길을 하나씩 골랐습니다"), bars: fu, top: fuTop[0], hi: p => futOf(p).k === fuTop[0] });
    const mb = count(L.filter(p => p.mbti && p.mbti !== "몰라요"), p => [p.mbti]);
    if (mb.length && mb[0][1] >= 2) { const E = L.filter(p => /^E/.test(p.mbti || "")).length, I = L.filter(p => /^I/.test(p.mbti || "")).length;
      out.push({ kick: "MBTI", h: `가장 많은 MBTI는 <b>${esc(mb[0][0])}</b> · ${mb[0][1]}명`, sub: `E ${E}명 · I ${I}명`, chips: mb.slice(0, 12), hi: p => p.mbti === mb[0][0] }); }
    const ifn = count(L, p => [String(p.ifnot || "").trim()]);
    const ifnN = ifn.reduce((s, x) => s + x[1], 0);
    if (ifnN >= 3) out.push({ kick: "의사가 안 됐다면", h: ifn[0][1] >= 2 ? `'${esc(ifn[0][0])}'라고 쓴 사람 <b>${ifn[0][1]}명</b>` : `<b>${ifn.length}가지</b> 다른 인생이 있었습니다`, sub: "의사가 안 됐다면 나는?", chips: ifn.slice(0, 18), hi: p => String(p.ifnot || "").trim() === ifn[0][0] && ifn[0][1] >= 2 || (ifn[0][1] < 2 && !!String(p.ifnot || "").trim()) });
    return out;
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ── 장면 ──
  // 0 원: 오늘 모인 사람 / 1 길: 10년 뒤 선 잇기 / 2 공통점(여러 장) / 3 마무리
  let scene = 0, fi = 0, F = [];
  const EM = "../../assets/emblem.png";
  function applyScene(enter) {
    F = facts(); if (fi >= F.length) fi = Math.max(0, F.length - 1);
    const N = order.length;
    const S = selOn() && !picking;
    linesG.classList.toggle("off", scene === 0 || N === 0 || picking);
    linesG.classList.toggle("faint", scene === 2);
    nodeEls.forEach(el => { el.classList.toggle("off", scene === 0 || picking); el.classList.toggle("faint", scene === 2); });
    const f = scene === 2 && !picking ? F[fi] : null;
    order.forEach(p => { p.el.classList.toggle("hi", !!(f && f.hi(p))); p.el.classList.toggle("dim", !!(f && !f.hi(p))); });
    // 같은 장면에서 사람이 늘어날 때는 글만 바꾸고 다시 페이드하지 않는다 (체크인마다 깜빡임 방지)
    const key = (picking ? "pick" : scene + "/" + fi) + "/" + (N ? 1 : 0) + (S ? "s" : ""), same = !enter && center.dataset.key === key;
    center.dataset.key = key;
    let h = "";
    if (picking) h = `<div class="big">지도에 넣을 사람 고르기</div><div class="sub">캐릭터를 누르면 넣고 뺍니다<br>이름표가 금색인 사람이 지도에 들어갑니다</div>`;
    else if (N === 0) h = `<img class="em" src="${EM}" alt=""><div class="big">체크인을 기다리는 중</div><div class="sub">${esc(CFG.joinUrl.replace(/^https?:\/\//, ""))}</div>`;
    else if (scene === 0) h = `<img class="em" src="${EM}" alt=""><div class="big">${S ? "KYPSN과 함께 시작하는" : "오늘 이 방의"} <b>${N}명</b></div><div class="sub">임상 · 연구 · 사업 사이 어딘가에서 왔습니다</div>`;
    else if (scene === 1) h = `<img class="em" src="${EM}" alt=""><div class="big">10년 뒤, 나는?</div><div class="sub">체크인 카드에 고른 길로 선을 이었습니다</div>`;
    else if (scene === 2 && f) h = `<div class="fact"><img class="em" src="${EM}" alt=""><div class="kick">${S ? "" : "오늘 "}${N}명의 공통점 ${fi + 1}/${F.length} · ${esc(f.kick)}</div><h2>${f.h}</h2><div class="sub">${f.sub || ""}</div>` +
      (f.bars ? `<div class="bars">${f.bars.map((b, i) => `<div class="${b[0] === (f.top || f.bars[0][0]) ? "top" : ""}"><span>${esc(b[0])}</span><span class="tr"><i data-w="${b[1] / f.bars[0][1] * 100}"></i></span><span>${b[1]}</span></div>`).join("")}</div>` : "") +
      (f.chips ? `<div class="chips">${f.chips.map((c, i) => `<span class="${i === 0 && c[1] >= 2 ? "top" : ""}">${esc(c[0])}${c[1] >= 2 ? " ×" + c[1] : ""}</span>`).join("")}</div>` : "") + `</div>`;
    else if (scene === 2) h = `<img class="em" src="${EM}" alt=""><div class="big">공통점을 찾는 중</div><div class="sub">체크인이 더 모이면 보여 드립니다</div>`;
    else h = `<img class="em" src="${EM}" alt=""><div class="big">10년 뒤, 이 지도를<br>다시 그립니다</div><div class="sub">KYPSN Night 2026 · 2026. 12. 5. 명동</div>`;
    if (same && center.dataset.html === h) return;
    center.dataset.html = h;
    center.innerHTML = `<div class="${same ? "" : "in"}">${h}</div>`;
    if (same) center.querySelectorAll(".bars i").forEach(i => { i.style.transition = "none"; i.style.width = i.dataset.w + "%"; });
    fillBars();
    const dots = $("dots"); dots.innerHTML = ""; [0, 1, 2, 3].forEach(i => { const d = document.createElement("i"); if (i === scene) d.className = "on"; dots.appendChild(d); });
    $("headSub").textContent = picking ? "지도에 넣을 사람 고르기 · 이 PC에만 저장됩니다" : S ? ["KYPSN과 함께 시작하는 사람들", "함께 시작하는 사람들이 가려는 길", "함께 시작하는 사람들의 공통점", "함께 시작하는 사람들이 가려는 길"][scene]
      : ["오늘 이 방에 모인 사람들", "오늘 이 방에 모인 사람들이 가려는 길", "오늘 모인 사람들의 공통점", "오늘 이 방에 모인 사람들이 가려는 길"][scene];
  }
  function fillBars() { requestAnimationFrame(() => center.querySelectorAll(".bars i").forEach(i => i.style.width = i.dataset.w + "%")); }

  function go(s, sub) {
    const prev = scene; scene = Math.max(0, Math.min(3, s)); fi = sub || 0;
    if ((scene === 1 || scene === 3) && prev !== scene && prev === 0) drawLines(true);
    applyScene(true);
  }
  function next() { if (scene === 2 && fi < F.length - 1) { fi++; applyScene(true); } else if (scene < 3) go(scene + 1, 0); }
  function prev() { if (scene === 2 && fi > 0) { fi--; applyScene(true); } else if (scene > 0) go(scene - 1, scene - 1 === 2 ? Math.max(0, F.length - 1) : 0); }

  // ── 조작 ──
  const bar = document.createElement("div"); bar.className = "bar";
  bar.innerHTML = '<span class="tag px">' + (DEMO ? "DEMO" : "MAP") + '</span><button data-k="prev">◀ 이전</button><button data-k="next">다음 ▶ (→)</button><button data-k="auto">자동 넘김 (A)</button><button data-k="pick">사람 고르기 (P)</button><button data-k="music">재즈 (M)</button><button data-k="fs">전체화면 (F)</button><button data-k="stage">무대 화면 (S)</button>';
  world.appendChild(bar);
  let autoT = null;
  function act(k) {
    if (k === "next") next(); else if (k === "prev") prev();
    else if (k === "auto") { if (autoT) { clearInterval(autoT); autoT = null; } else autoT = setInterval(() => { if (scene === 3) go(0); else next(); }, 7000); bar.querySelector("[data-k=auto]").classList.toggle("on", !!autoT); }
    else if (k === "music" && window.KJazz) { KJazz.toggle(); bar.querySelector("[data-k=music]").classList.toggle("on", !!KJazz.on); }
    else if (k === "fs") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
    else if (k === "pick") setPicking(!picking);
    else if (k === "stage") location.href = "../stage/" + (DEMO ? "?demo" : "");
  }
  bar.querySelectorAll("button").forEach(b => { b.tabIndex = -1; b.onclick = e => { e.stopPropagation(); b.blur(); act(b.dataset.k); }; });
  world.addEventListener("click", () => { if (!picking) next(); });

  // 고르기 판
  const pk = document.createElement("div"); pk.className = "pick hidden";
  pk.innerHTML = '<b>지도에 넣을 사람</b><p>캐릭터를 눌러 넣고 빼거나, 이름을 쉼표나 줄바꿈으로 붙여 넣으세요. 아직 체크인 안 한 이름은 체크인하는 순간 들어옵니다. 명단은 이 PC 브라우저에만 저장됩니다.</p>' +
    '<textarea placeholder="예: 홍길동, 김철수"></textarea><div class="row"><button data-p="apply">이름 적용</button><button data-p="all">전원 넣기</button><button data-p="clear">모두 빼기</button><button data-p="done">끝내기 (P)</button></div><div class="st"></div>';
  world.appendChild(pk);
  const pkTa = pk.querySelector("textarea"), pkSt = pk.querySelector(".st");
  pk.addEventListener("click", e => e.stopPropagation());
  pk.querySelectorAll("button").forEach(b => { b.tabIndex = -1; b.onclick = () => {
    const a = b.dataset.p;
    if (a === "apply") { sel.names = pkTa.value.split(/[,\n;]/).map(x => x.trim()).filter(Boolean); sel.del = {}; }
    else if (a === "all") { sel.names = []; sel.del = {}; sel.add = {}; [...people.values()].forEach(p => { if (!hidden[p.cid]) sel.add[p.cid] = 1; }); }
    else if (a === "clear") { sel = {}; selFix(); pkTa.value = ""; }
    else if (a === "done") return setPicking(false);
    saveSel(); render({ quiet: true });
  }; });
  function pickStat(allN) {
    const L = [...people.values()].filter(p => !hidden[p.cid]);
    const miss = sel.names.filter(n => !L.some(p => norm(p.name) === norm(n)));
    pkSt.textContent = "넣은 사람 " + L.filter(chosen).length + "명 / 체크인 " + allN + "명" + (miss.length ? " · 아직 체크인 안 한 이름: " + miss.join(", ") : "");
  }
  function setPicking(on) {
    picking = on; pk.classList.toggle("hidden", !on); bar.querySelector("[data-k=pick]").classList.toggle("on", on);
    if (on) pkTa.value = sel.names.join(", ");
    if (on && autoT) act("auto");
    render({ quiet: true }); applyScene(true);
  }
  document.addEventListener("keydown", e => {
    const k = e.key;
    if (e.target && /TEXTAREA|INPUT/.test(e.target.tagName)) return;
    if (k.toLowerCase() === "p") { setPicking(!picking); return; }
    if (picking) return;
    if (k === "ArrowRight" || k === " " || k === "PageDown" || k === "Enter") { e.preventDefault(); next(); }
    else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); prev(); }
    else if (k >= "1" && k <= "4") go(+k - 1, 0);
    else ({ a: "auto", m: "music", f: "fs", s: "stage" })[k.toLowerCase()] && act(({ a: "auto", m: "music", f: "fs", s: "stage" })[k.toLowerCase()]);
  });
  let hideT; document.addEventListener("mousemove", () => { bar.classList.add("show"); clearTimeout(hideT); hideT = setTimeout(() => bar.classList.remove("show"), 2500); });
  window.addEventListener("storage", e => { if (e.key === "kypsn-night-stage") render({ quiet: true }); });

  // ── 데이터 ──
  let firstSync = true;
  function sync(entries) {
    let ch = false; entries.forEach(e => { if (upsert(e)) ch = true; });
    if (ch || firstSync) render({ quiet: firstSync, animate: false });
    firstSync = false;
  }

  if (DEMO) {
    // 시험용 가상 참석자 (?demo=33). 실제 사람이 아닙니다
    const NAMES = ["김하늘", "이서준", "박지우", "최민서", "정도윤", "강서연", "조하준", "윤지민", "장예린", "임현우", "한소율", "오태윤", "서지호", "신유나", "권도현", "황채원", "안시우", "송하린", "류건우", "전수아", "홍예준", "문가은", "배시훈", "남궁별", "구본재", "노은채", "하윤서", "탁지환", "명소은", "변재윤", "Alex Kim", "엄태오", "차다인"];
    const r = K.rng(20261205), pick = a => a[Math.floor(r() * a.length)];
    const POS = ["의대생", "의대생", "전공의", "전공의", "전임의", "전문의·교수", "대학원생", "산업계·창업"];
    const INT = ["연구", "창업", "산업계", "AI·디지털", "의료기기", "신약·바이오", "정책·제도", "투자·금융"];
    const FW = ["연구하는 임상의", "연구하는 임상의", "교수", "창업가", "창업가", "창업가", "산업계 리더", "투자자", "아직 탐색 중", "아직 탐색 중"];
    const MB = ["ENTJ", "ENTJ", "INTJ", "INTP", "ENFP", "ISTJ", "INFJ", "ESTP", "몰라요", "ENTP"];
    const IFN = ["셰프", "셰프", "건축가", "프로게이머", "기자", "", "", "음악가", "변호사", "체스 선수", "개발자", "개발자", "", "파일럿"];
    const N = Math.min(60, Math.max(1, +params.get("demo") || 33));
    const demo = [];
    for (let i = 0; i < N; i++) {
      const ints = [...new Set(Array.from({ length: 1 + Math.floor(r() * 3.6) }, () => pick(INT)))];
      demo.push({ kind: "intro", cid: "demo" + i, name: NAMES[i % NAMES.length] + (i >= NAMES.length ? i : ""), sex: r() < .45 ? "여" : "남", role: pick(["내과 전공의 · 의공학 박사과정", "정형외과 전문의 · 웨어러블 센서", "영상의학과 전공의 · AI 판독", "재활의학과 전임의 · 보행 분석", "가정의학과 · 디지털헬스 창업", "병리과 전공의 · 공간 전사체", "의대 본과 3학년 · 창업 동아리", "신경과 전임의 · 뇌과학 박사"]), pos: pick(POS), interest: ints.join(", "), future: pick(FW), mbti: pick(MB), ifnot: pick(IFN), ts: new Date(Date.UTC(2026, 11, 5, 9) + i * 60000).toISOString() });
    }
    if (params.has("sel")) { sel = { add: {} }; selFix(); for (let i = 0; i < Math.min(N, +params.get("sel") || 10); i++) sel.add["demo" + (i * 3 % N)] = 1; saveSel(); }
    const start = Math.max(1, N - 3);
    sync(demo.slice(0, start));
    let k = start; const t = setInterval(() => { if (k >= N) return clearInterval(t); sync(demo.slice(0, ++k)); }, 2500);
    const v = params.get("scene"); if (v) go(+v, +(params.get("fact") || 0));
  } else {
    K.listen(sync, CFG.pollMs);
    render({ quiet: true });
  }
  window.__map = { people, get order() { return order; }, get scene() { return scene; }, get facts() { return F; }, go, next, prev };
})();
</script>
